name: Gerar PPT da Usina

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-ppt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar arquivo PPT
        run: |
          python scripts/gerar_ppt_usina.py

      - name: Commit e push do arquivo gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apresentacao_usina_concreto.pptx
          git diff --cached --quiet && echo "Nenhuma alteração para commit" && exit 0
          git commit -m "Generate PowerPoint presentation"
          git push
